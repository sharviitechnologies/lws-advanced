<script>
class DCLogic { constructor(p){ this.props=p||{}; this.state={}; } setState(o){ Object.assign(this.state,o); render(); } }

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sc: 0, pMon: 0, pTier: 0, faqOpen: 0 }; }
  renderVals() {
    const s = this.state;
    const set = (o) => this.setState(o);
    const SC = [["Standalone equipment required", "Sites or policies that call for purpose-built safety equipment.", "A personal phone may not meet the organisation’s protection requirement.", "A dedicated safety device carried by the worker.", false], ["No personal phone", "Workers who don’t carry, or shouldn’t rely on, a personal phone at work.", "App-based protection depends on a phone being available.", "Protection independent of a personal phone.", false], ["Remote or isolated work", "Working with no colleagues nearby and support some distance away.", "An incident may not be noticed quickly.", "A dependable way to raise an alert and be located.", true], ["Complex mobile working", "Moving between sites, vehicles and locations through a shift.", "Circumstances change across the day.", "Protection that moves with the worker.", true], ["Greater oversight needed", "Organisations responsible for large or dispersed teams.", "Managers need to see workers and alerts together.", "Centralised visibility of workers and alerts.", true]];
    const seg = "min-height: 46px; border: none; cursor: pointer; font: 600 14px system-ui; ";
    const PMON = ["Self-Monitored", "24/7 Professionally Monitored"];
    const TIERS = ["1–24", "25–99", "100+"];
    const FAQ = [
      ["ADVANCED PROTECTION", "How is Advanced different from Protect and Protect+?", "Advanced uses a dedicated device carried by the worker, independent of a personal phone. It suits environments or policies that call for standalone, purpose-built equipment."],
      ["WORKING ENVIRONMENTS", "Do workers need their own smartphone?", "No. LWS Advanced uses a dedicated device, independent of a personal phone."],
      ["MONITORING", "Can we use our own responders?", "Yes. With self-monitoring, your organisation manages alerts using its own designated responders."],
      ["MONITORING", "Is professional monitoring available?", "Yes. LWS monitoring personnel can handle alerts according to the applicable monitoring service."]
    ];
    return {
      scen: SC.map((x, i) => ({ n: "0" + (i + 1), name: x[0], pressed: s.sc === i ? "true" : "false", mark: s.sc === i ? "→" : "",
        markStyle: "font: 600 16px system-ui;",
        style: "display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 20px; border: none; border-bottom: 1px solid #e2e2df; cursor: pointer; text-align: left; font: 600 16px system-ui; " + (s.sc === i ? "background: #1a1a1a; color: #ffffff;" : "background: #ffffff; color: #1a1a1a;"),
        pick: () => set({ sc: i }) })),
      cur: { env: SC[s.sc][1], risk: SC[s.sc][2], need: SC[s.sc][3],
        flagStyle: SC[s.sc][4] ? "font: 600 10px ui-monospace, Menlo, monospace; color: #f0b980; letter-spacing: .06em;" : "display: none;" },
      priceMon: PMON.map((l, i) => ({ label: l, pressed: s.pMon === i ? "true" : "false",
        style: seg + (s.pMon === i ? "background: #1a1a1a; color: #ffffff;" : "background: #ffffff; color: #3a3a37;") + (i ? " border-left: 1px solid #1a1a1a;" : ""), pick: () => set({ pMon: i }) })),
      priceTier: TIERS.map((l, i) => ({ label: l, pressed: s.pTier === i ? "true" : "false",
        style: "min-height: 46px; border-radius: 4px; cursor: pointer; font: 600 15px system-ui; " + (s.pTier === i ? "background: #1a1a1a; color: #ffffff; border: 1px solid #1a1a1a;" : "background: #ffffff; color: #1a1a1a; border: 1px solid #c9c9c5;"), pick: () => set({ pTier: i }) })),
      priceSummary: PMON[s.pMon] + " · " + TIERS[s.pTier] + " users — sent with your request",
      faqs: FAQ.map((f, i) => ({ cat: f[0], q: f[1], a: f[2], open: s.faqOpen === i, expanded: s.faqOpen === i ? "true" : "false", sign: s.faqOpen === i ? "\u2212" : "+",
        toggle: () => set({ faqOpen: s.faqOpen === i ? -1 : i }) }))
    };
  }
}

const comp = new Component({});
const tpl = document.getElementById('tpl');
const mount = document.getElementById('app');
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
function look(path, scope){
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  const parts = path.split('.'); let v = scope;
  for (const p of parts){ if (v == null) return undefined; v = v[p]; }
  return v;
}
function whole(str){ const m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(str); return m ? m[1] : null; }
function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
function renderNode(n, scope, out){
  if (n.nodeType === 3){ out.push(document.createTextNode(interp(n.nodeValue, scope))); return; }
  if (n.nodeType !== 1) return;
  const tag = n.localName;
  if (tag === 'sc-for'){
    const list = look(whole(n.getAttribute('list')), scope) || [];
    const as = n.getAttribute('as') || 'item';
    list.forEach((item, idx) => { const sc = Object.create(scope); sc[as] = item; sc.$index = idx; n.childNodes.forEach(c => renderNode(c, sc, out)); });
    return;
  }
  if (tag === 'sc-if'){ if (look(whole(n.getAttribute('value')), scope)) n.childNodes.forEach(c => renderNode(c, scope, out)); return; }
  const el = n.namespaceURI && n.namespaceURI !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(n.namespaceURI, n.tagName) : document.createElement(tag);
  for (const a of n.attributes){
    const w = whole(a.value);
    if (a.name.startsWith('on') && w){ const fn = look(w, scope); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); continue; }
    if (a.name.startsWith('hint-')) continue;
    el.setAttribute(a.name, interp(a.value, scope));
  }
  const kids = []; n.childNodes.forEach(c => renderNode(c, scope, kids)); kids.forEach(k => el.appendChild(k));
  out.push(el);
}
function render(){
  const vals = comp.renderVals(); const out = [];
  tpl.content.childNodes.forEach(c => renderNode(c, vals, out));
  mount.replaceChildren(...out);
}
render();
